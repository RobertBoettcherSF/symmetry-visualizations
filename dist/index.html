// One entry per Ada visualization; parameter order = Params (1 ..) in Ada.
const VIZ = [
 {name: "Rule 30", params: [["Rule",0,255,30],["Width",51,1023,401],["Height",50,1000,300],
   ["Random start (0/1)",0,1,0],["Frames per row",1,4,2],["Hue",0,359,45]]},
 {name: "Game of Life", params: [["Width",20,1000,160],["Height",20,1000,100],["Density %",1,99,30],
   ["Wrap edges (0/1)",0,1,1],["Frames per generation",1,60,4],["Hue",0,359,120]]},
 {name: "Star Mandala", params: [["Size",200,1000,480],["Star points",3,16,7],
   ["Colour (0 = white, else hue)",0,359,0],["Triangle size (% of radius)",2,20,6]]},
 {name: "Field 1: Dipole", params: [["Size",200,1000,420],["Lines per charge",4,48,16],["Colour (0 = cream, else hue)",0,359,0]]},
 {name: "Field 2: Four loops", params: [["Size",200,1000,420],["Lines per charge",4,48,12],["Colour (0 = cream, else hue)",0,359,0]]},
 {name: "Field 3: Two dipoles", params: [["Size",200,1000,420],["Lines per charge",4,48,10],["Colour (0 = cream, else hue)",0,359,0]]},
 {name: "Field 4: Grid globe", params: [["Size",200,1000,420],["Lines per charge",4,48,16],["Colour (0 = cream, else hue)",0,359,0]]},
 {name: "Field 5: Fan", params: [["Size",200,1000,420],["Lines per charge",4,48,10],["Colour (0 = cream, else hue)",0,359,0]]},
 {name: "Growth Tree", params: [["Size",200,1000,480],["Max depth",3,10,7],["Colour (0 = white, else hue)",0,359,0]]},
 {name: "Balance", params: [["Size",200,1000,600],["Speed",1,10,3],["Colour (0 = white, else hue)",0,359,0]]},
];

// ---- event log, kept in localStorage so it survives a crash ----
const LOG_MAX = 200, store = localStorage;
let log = JSON.parse(store.getItem("sv.log") || "[]"), errors = [];
function note(ev, data) {
  log.push({t: new Date().toISOString(), ev, data});
  if (log.length > LOG_MAX) log.shift();
  store.setItem("sv.log", JSON.stringify(log));
}
function download(name, obj) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], {type: "application/json"}));
  a.download = name; a.click();
  note("download", name);
}
function stamp() { return new Date().toISOString().replace(/[:.]/g, "-"); }

// Crash detection: "sv.clean" is set to 1 only when the page closes normally.
const crashedBefore = store.getItem("sv.clean") === "0";
const previousLog = log.slice();
store.setItem("sv.clean", "0");
note("start", {version: VERSION, crashedBefore});
let fatal = false;
addEventListener("pagehide", () => { if (!fatal) { note("clean exit"); store.setItem("sv.clean", "1"); } });
setInterval(() => store.setItem("sv.heartbeat", Date.now()), 2000);
onerror = (msg, src, line) => { errors.push(msg + " @" + line); note("error", msg + " @" + line); };
onunhandledrejection = e => { errors.push(String(e.reason)); note("rejection", String(e.reason)); };
if (crashedBefore) {
  crash.hidden = false;
  crashDl.onclick = () => download("crash-report-" + stamp() + ".json", {version: VERSION,
    lastHeartbeat: new Date(+store.getItem("sv.heartbeat")).toISOString(),
    browser: navigator.userAgent, eventsBeforeCrash: previousLog,
    eventsAfterReload: log.slice(previousLog.length)});
}

// ---- settings (user values per visualization) ----
const saved = JSON.parse(store.getItem("sv.settings") || "[]");
let settings = VIZ.map((v, i) => saved[i] && saved[i].length === v.params.length ? saved[i] : v.params.map(p => p[3]));
VIZ.forEach((v, i) => {
  menu.add(new Option(v.name, i));
  const f = document.createElement("fieldset");
  f.innerHTML = "<legend>" + v.name + "</legend>" + v.params.map((p, j) =>
    `<label>${p[0]}<input type=number min=${p[1]} max=${p[2]} value=${settings[i][j]} data-v=${i} data-p=${j}></label>`).join("");
  setPanel.append(f);
});
setPanel.insertAdjacentHTML("beforeend", "<button id=apply>Apply</button> <button id=reset>Defaults</button>");
setBtn.onclick = () => setPanel.hidden = !setPanel.hidden;
apply.onclick = () => {
  setPanel.querySelectorAll("input").forEach(e => {
    const p = VIZ[e.dataset.v].params[e.dataset.p];
    settings[e.dataset.v][e.dataset.p] = Math.min(p[2], Math.max(p[1], Math.round(+e.value) || p[3]));
  });
  store.setItem("sv.settings", JSON.stringify(settings));
  note("settings", settings);
  if (menu.value >= 0) run(+menu.value, settings[menu.value]);
};
reset.onclick = () => { store.removeItem("sv.settings"); location.reload(); };

// ---- the WebAssembly (Ada) side ----
let ada, current = -1, values = [], fps = 0, frames = 0, cycleTimer;
const view = document.getElementById("view"), ctx = view.getContext("2d"), off = document.createElement("canvas");

function run(i, vals) {
  current = i; values = vals;
  vals.forEach((v, j) => ada.sv_set_param(j + 1, v));
  ada.sv_start(i, (Math.random() * 2 ** 32) >>> 0);
  info.textContent = VIZ[i].name + ": " + VIZ[i].params.map((p, j) => p[0] + "=" + vals[j]).join(", ");
  note("run", {viz: VIZ[i].name, params: vals});
}
function randomRun() {
  const i = (current + 1) % VIZ.length;
  run(i, VIZ[i].params.map(p => p[1] + Math.floor(Math.random() * (p[2] - p[1] + 1))));
}
menu.onchange = () => {
  clearInterval(cycleTimer);
  if (menu.value < 0) { randomRun(); cycleTimer = setInterval(randomRun, CYCLE_SECONDS * 1000); }
  else run(+menu.value, settings[menu.value]);
};

function frame() {
  if (fatal) return;
  try {
    ada.sv_tick();
    const w = ada.sv_width(), h = ada.sv_height();
    off.width = w; off.height = h;
    off.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray(ada.memory.buffer, ada.sv_frame(), w * h * 4), w, h), 0, 0);
    view.width = innerWidth; view.height = innerHeight;
    const s = Math.min(innerWidth / w, innerHeight / h);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off, (innerWidth - w * s) / 2, (innerHeight - h * s) / 2, w * s, h * s);
    frames++;
  } catch (e) {               // a WebAssembly trap (e.g. out of bounds) ends up here
    fatal = true; errors.push(String(e)); note("wasm trap", String(e));
    crash.hidden = false; crash.firstChild.textContent = "The visualization crashed: " + e + ". ";
    crashDl.onclick = () => download("crash-report-" + stamp() + ".json",
      {version: VERSION, browser: navigator.userAgent, events: log});
    return;
  }
  requestAnimationFrame(frame);
}
setInterval(() => { fps = frames; frames = 0; }, 1000);

// ---- F9: one feedback file with everything useful ----
addEventListener("keydown", e => {
  if (e.key !== "F9") return;
  e.preventDefault();
  download("feedback-" + stamp() + ".json", {version: VERSION, time: new Date().toISOString(),
    browser: navigator.userAgent, screen: [innerWidth, innerHeight, devicePixelRatio],
    mode: menu.value < 0 ? "cycle" : "selected", visualization: VIZ[current] && VIZ[current].name,
    parameters: values, settings, fps, errors, events: log});
});

WebAssembly.instantiate(Uint8Array.from(atob(WASM), c => c.charCodeAt(0))).then(r => {
  ada = r.instance.exports;
  note("wasm loaded");
  menu.onchange();
  requestAnimationFrame(frame);
});
